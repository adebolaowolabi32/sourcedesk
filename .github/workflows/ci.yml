name: Validate SourceDesk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      vectors:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: sourcedesk
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: sourcedesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sourcedesk -d sourcedesk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_VECTOR_DATABASE_URL: postgresql://sourcedesk:ci_only@127.0.0.1:5432/sourcedesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run evaluate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sourcedesk-evidence
          path: |
            docs/desktop.png
            docs/mobile.png
            docs/answer.png
            docs/evaluation-report.json
            test-results/
